name: Build Test DMG
# Privacy rebuild: rec-events off by default.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/dmg-build.yml']

permissions:
  contents: read

jobs:
  dmg:
    name: macOS ${{ matrix.arch }} DMG (unsigned test build)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    concurrency:
      group: dmg-build-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Fetch macOS libmpv runtime (LFS, arch-only)
        env:
          MACOS_ARCH: ${{ matrix.arch }}
        run: git lfs pull --include="composeApp/src/desktopMain/native/macos/runtime/${MACOS_ARCH}/**" --exclude=""

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write empty runtime keys
        run: |
          {
            echo "SUPABASE_URL="
            echo "SUPABASE_ANON_KEY="
            echo "TMDB_API_KEY="
            echo "TRAKT_CLIENT_ID="
            echo "TRAKT_CLIENT_SECRET="
            echo "SIMKL_CLIENT_ID="
            echo "SIMKL_CLIENT_SECRET="
            echo "MDBLIST_CLIENT_ID="
            echo "DONATIONS_DONATE_URL="
          } > local.properties

      - name: Build DMG (unsigned)
        env:
          MACOS_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: 0.0.${{ github.run_number }}
        run: |
          ./gradlew \
            :composeApp:packageReleaseDmg \
            "-Pnuvio.macos.arch=${MACOS_ARCH}" \
            "-Pnuvio.desktop.versionName=${RELEASE_VERSION}" \
            "-Pnuvio.desktop.versionCode=${GITHUB_RUN_NUMBER}" \
            "-PversionNameOverride=${RELEASE_VERSION}" \
            "-PversionCodeOverride=${GITHUB_RUN_NUMBER}" \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

      - name: Verify DMG
        env:
          MACOS_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: 0.0.${{ github.run_number }}
        run: |
          dmg_path="composeApp/build/compose/release-dmgs/Tuvora-macOS-${MACOS_ARCH}-${RELEASE_VERSION}.dmg"
          if [[ ! -f "${dmg_path}" ]]; then
            echo "Expected DMG was not produced: ${dmg_path}" >&2
            ls -la composeApp/build/compose/release-dmgs/ composeApp/build/compose/binaries/main-release/dmg/ 2>/dev/null
            exit 1
          fi
          hdiutil verify "${dmg_path}"

      - name: Summarize DMG
        env:
          MACOS_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: 0.0.${{ github.run_number }}
        run: |
          dmg_path="composeApp/build/compose/release-dmgs/Tuvora-macOS-${MACOS_ARCH}-${RELEASE_VERSION}.dmg"
          {
            echo "## Test DMG (${{ matrix.arch }})"
            echo
            echo "- File: $(basename "${dmg_path}")"
            echo "- Size: $(du -h "${dmg_path}" | cut -f1)"
            echo "- SHA-256: $(shasum -a 256 "${dmg_path}" | awk '{print $1}')"
            echo "- Signing: unsigned"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: tuvora-desktop-macos-${{ matrix.arch }}-${{ github.run_number }}
          path: composeApp/build/compose/release-dmgs/Tuvora-macOS-*.dmg
          if-no-files-found: error
          retention-days: 14
